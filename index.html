<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gara Gokart - Interactive Multi-Cam</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100vh;
      height: 100dvh; /* Considera le barre dinamiche del browser su mobile */
      width: 100vw;
      margin: 0;
      padding: 4px;
      background: #121212; 
      color: white; 
      font-family: sans-serif; 
      text-align: center; 
      overflow: hidden !important; /* Blocca tassativamente lo scroll */
    }

    body {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    h1 {
      margin: 0;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .controls-container {
      background: #1e1e1e; 
      border: 1px solid #333; 
      border-radius: 6px;
      padding: 3px 6px; 
      width: 100%; 
      margin: 0 auto;
      display: flex; 
      flex-direction: column; 
      gap: 3px; 
      align-items: center;
      flex-shrink: 0;
    }

    .playback-controls { 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      width: 100%; 
      justify-content: center; 
    }
    
    .btn-control {
      background: #2563eb; 
      color: white; 
      border: none; 
      padding: 4px 8px;
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 11px; 
      font-weight: bold;
      flex-shrink: 0;
    }
    .btn-global.mute-mode { background: #dc2626; }
    .btn-global.unmute-mode { background: #2563eb; }

    .time-slider { 
      flex: 1; 
      max-width: 350px;
      cursor: pointer; 
    }
    .time-display { 
      font-family: monospace; 
      font-size: 10px; 
      white-space: nowrap;
    }

    /* Griglia 3 colonne x 2 righe su PC e Tablet */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      grid-template-rows: repeat(2, 1fr);
      gap: 4px; 
      width: 100%; 
      flex: 1;
      min-height: 0;
    }

    /* Modalità Ingrandito */
    .grid.has-featured {
      display: flex;
      flex: 1;
      width: 100%;
      height: 100%;
    }

    .grid.has-featured .card:not(.featured) {
      display: none !important;
    }

    .grid.has-featured .card.featured {
      width: 100%;
      height: 100%;
      margin: 0;
      border-color: #2563eb;
      box-shadow: 0 0 25px rgba(37, 99, 235, 0.6);
    }
    
    .card { 
      border: 2px solid #00ff88; 
      border-radius: 6px; 
      overflow: hidden; 
      background: #1e1e1e; 
      display: flex;
      flex-direction: column;
      cursor: pointer; 
      user-select: none;
      transition: border-color 0.2s ease;
      min-height: 0;
    }
    .card.audio-off { border-color: #333; }

    .video-wrapper {
      flex: 1;
      width: 100%;
      min-height: 0;
      background: #000;
      position: relative;
    }

    iframe, .poster-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      object-fit: cover;
    }

    iframe {
      pointer-events: none;
    }

    .poster-img {
      z-index: 2;
      transition: opacity 0.3s ease;
    }

    .poster-img.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card-footer {
      padding: 2px;
      background: #1e1e1e;
      flex-shrink: 0;
    }

    p { margin: 0 0 2px 0; font-size: 10px; font-weight: bold; }
    
    .card-actions { display: flex; justify-content: center; gap: 4px; }

    .btn-single, .btn-focus {
      background: #00ff88; 
      color: black; 
      border: 1px solid #555; 
      padding: 2px 5px;
      border-radius: 3px; 
      cursor: pointer; 
      font-size: 9px; 
      font-weight: bold;
      transition: 0.2s;
    }
    .card.audio-off .btn-single { background: #333; color: white; font-weight: normal; }
    .btn-focus { background: #2563eb; color: white; font-weight: bold; }

    /* Smartphone Mobile in verticale: adatta 3 colonne sottili per stare tutto in 1 schermata */
    @media (max-width: 600px) {
      h1 { font-size: 0.8rem; }
      .controls-container { padding: 2px 4px; gap: 2px; }
      .btn-control { padding: 2px 6px; font-size: 9px; }
      
      .grid { 
        grid-template-columns: repeat(3, 1fr); 
        grid-template-rows: repeat(2, 1fr);
        gap: 3px; 
      }

      p { font-size: 8px; margin: 0; }
      .btn-single, .btn-focus { padding: 1px 3px; font-size: 7.5px; }
    }
  </style>
</head>
<body>
  <h1>Gara Gokart Udine - Interactive Multi-Cam</h1>
  
  <div class="controls-container">
    <div class="playback-controls">
      <button id="btnPlayPause" class="btn-control" onclick="togglePlayPause()">▶️ Play</button>
      <input type="range" id="seekBar" class="time-slider" value="0" min="0" max="100" step="0.1" oninput="seekAll(this.value)">
      <span id="timeDisplay" class="time-display">00:00 / 00:00</span>
    </div>
    <div>
      <button id="btnGlobal" class="btn-control btn-global mute-mode" onclick="handleGlobalClick()">🔇 Muta Tutti</button>
    </div>
  </div>

  <div class="grid">
    <div class="card" id="card-0" onclick="toggleAudio(0, event)">
      <div class="video-wrapper">
        <img id="poster-0" class="poster-img" src="https://img.youtube.com/vi/ctNbkpWVy4g/hqdefault.jpg" alt="Preview Pilota 1">
        <div id="v0"></div>
      </div>
      <div class="card-footer">
        <p>Pilota 1</p>
        <div class="card-actions">
          <button class="btn-single">🔊 Audio ON</button>
          <button class="btn-focus" onclick="toggleFocus(0, event)">🔍 Ingrandisci</button>
        </div>
      </div>
    </div>

    <div class="card" id="card-1" onclick="toggleAudio(1, event)">
      <div class="video-wrapper">
        <img id="poster-1" class="poster-img hidden" src="" alt="Preview Pilota 2">
        <div id="v1"></div>
      </div>
      <div class="card-footer">
        <p>Pilota 2</p>
        <div class="card-actions">
          <button class="btn-single">🔊 Audio ON</button>
          <button class="btn-focus" onclick="toggleFocus(1, event)">🔍 Ingrandisci</button>
        </div>
      </div>
    </div>

    <div class="card" id="card-2" onclick="toggleAudio(2, event)">
      <div class="video-wrapper">
        <img id="poster-2" class="poster-img" src="https://img.youtube.com/vi/FNPA_kQMaD0/hqdefault.jpg" alt="Preview Pilota 3">
        <div id="v2"></div>
      </div>
      <div class="card-footer">
        <p>Pilota 3</p>
        <div class="card-actions">
          <button class="btn-single">🔊 Audio ON</button>
          <button class="btn-focus" onclick="toggleFocus(2, event)">🔍 Ingrandisci</button>
        </div>
      </div>
    </div>

    <div class="card" id="card-3" onclick="toggleAudio(3, event)">
      <div class="video-wrapper">
        <img id="poster-3" class="poster-img" src="https://img.youtube.com/vi/6SaxWshz-Hg/hqdefault.jpg" alt="Preview Pilota 4">
        <div id="v3"></div>
      </div>
      <div class="card-footer">
        <p>Pilota 4</p>
        <div class="card-actions">
          <button class="btn-single">🔊 Audio ON</button>
          <button class="btn-focus" onclick="toggleFocus(3, event)">🔍 Ingrandisci</button>
        </div>
      </div>
    </div>

    <div class="card" id="card-4" onclick="toggleAudio(4, event)">
      <div class="video-wrapper">
        <img id="poster-4" class="poster-img" src="https://img.youtube.com/vi/8eQmVKUpvYU/hqdefault.jpg" alt="Preview Pilota 5">
        <div id="v4"></div>
      </div>
      <div class="card-footer">
        <p>Pilota 5</p>
        <div class="card-actions">
          <button class="btn-single">🔊 Audio ON</button>
          <button class="btn-focus" onclick="toggleFocus(4, event)">🔍 Ingrandisci</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const youtubeIDs = [
      'ctNbkpWVy4g',
      '', 
      'FNPA_kQMaD0',
      '6SaxWshz-Hg',
      '8eQmVKUpvYU'
    ];

    let players = [];
    let isPlaying = false;
    let maxDuration = 0;
    let featuredIndex = null;
    let previousAudioStates = [];
    const grid = document.querySelector('.grid');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const btnPlayPause = document.getElementById('btnPlayPause');

    function onYouTubeIframeAPIReady() {
      for (let i = 0; i < 5; i++) {
        if (!youtubeIDs[i]) continue;

        players[i] = new YT.Player(`v${i}`, {
          videoId: youtubeIDs[i],
          playerVars: {
            'controls': 0,
            'rel': 0,
            'modestbranding': 1,
            'playsinline': 1,
            'enablejsapi': 1
          },
          events: { 
            'onReady': (event) => onPlayerReady(event, i),
            'onStateChange': (event) => onPlayerStateChange(event, i)
          }
        });
      }
    }

    function onPlayerReady(event, index) {
      const p = event.target;
      p.mute(); // Muto iniziale per far caricare il player al browser
      
      if (typeof p.getDuration === 'function') {
        const d = p.getDuration();
        if (d > maxDuration) maxDuration = d;
      }
    }

    // Gestisce la fine dei singoli video per evitare il riavvio in loop
    function onPlayerStateChange(event, index) {
      if (event.data === YT.PlayerState.ENDED) {
        const p = players[index];
        if (p && p.pauseVideo) {
          p.pauseVideo();
        }
      }
    }

    setInterval(() => {
      const activePlayer = players.find(p => p && typeof p.getCurrentTime === 'function');
      if (maxDuration > 0 && activePlayer) {
        const currentTime = activePlayer.getCurrentTime() || 0;
        const progress = (currentTime / maxDuration) * 100;
        seekBar.value = progress;
        timeDisplay.innerText = `${formatTime(currentTime)} / ${formatTime(maxDuration)}`;
      }
    }, 100);

    function hideAllPosters() {
      document.querySelectorAll('.poster-img').forEach(img => img.classList.add('hidden'));
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;

      if (isPlaying) {
        hideAllPosters();
      }

      const activePlayer = players.find(p => p && typeof p.getCurrentTime === 'function');
      const refTime = activePlayer ? activePlayer.getCurrentTime() : 0;

      players.forEach((p, idx) => {
        if (p && p.playVideo) {
          const videoDuration = typeof p.getDuration === 'function' ? p.getDuration() : maxDuration;

          if (isPlaying) {
            // Fai partire il video solo se il tempo corrente non supera la sua durata
            if (refTime < videoDuration) {
              p.seekTo(refTime, true);
              const card = document.getElementById(`card-${idx}`);
              
              if (card && !card.classList.contains('audio-off')) {
                p.unMute();
              } else {
                p.mute();
              }
              p.playVideo();
            } else {
              p.pauseVideo();
            }
          } else {
            p.pauseVideo();
          }
        }
      });
      btnPlayPause.innerText = isPlaying ? '⏸️ Pausa' : '▶️ Play';
    }

    // Gestione dello scrubber sincronizzato con la durata singola di ogni traccia
    function seekAll(percent) {
      if (!maxDuration) return;
      const targetTime = (percent / 100) * maxDuration;

      players.forEach(p => {
        if (p && p.seekTo) {
          const videoDuration = typeof p.getDuration === 'function' ? p.getDuration() : maxDuration;

          if (targetTime < videoDuration) {
            p.seekTo(targetTime, true);
            if (isPlaying) p.playVideo();
          } else {
            // Se il target supera la durata del video, lo porta alla fine e lo mette in pausa
            p.seekTo(videoDuration - 0.1, true);
            p.pauseVideo();
          }
        }
      });
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function toggleFocus(index, event) {
      if (event) event.stopPropagation();
      const card = document.getElementById(`card-${index}`);
      const btnFocus = card.querySelector('.btn-focus');

      if (featuredIndex === index) {
        card.classList.remove('featured');
        grid.classList.remove('has-featured');
        btnFocus.innerText = '🔍 Ingrandisci';
        featuredIndex = null;
        players.forEach((_, i) => updateCardUI(i, previousAudioStates[i]));
      } else {
        previousAudioStates = players.map(p => {
          const c = document.getElementById(`card-${p}`);
          return c ? c.classList.contains('audio-off') : false;
        });

        players.forEach((_, i) => {
          const c = document.getElementById(`card-${i}`);
          if (c) {
            c.classList.remove('featured');
            c.querySelector('.btn-focus').innerText = '🔍 Ingrandisci';
          }
        });

        card.classList.add('featured');
        grid.classList.add('has-featured');
        btnFocus.innerText = '🔙 Riduci';
        featuredIndex = index;
        players.forEach((_, i) => updateCardUI(i, i !== index));
      }
      updateGlobalButtonState();
    }

    function updateCardUI(index, isMuted) {
      const player = players[index];
      const card = document.getElementById(`card-${index}`);
      if (!card) return;
      const button = card.querySelector('.btn-single');

      if (isMuted) {
        if (player && player.mute) player.mute();
        card.classList.add('audio-off');
        if (button) button.innerText = '🔊 Audio Off';
      } else {
        if (player && player.unMute) player.unMute();
        card.classList.remove('audio-off');
        if (button) button.innerText = '🔊 Audio ON';
      }
    }

    function toggleAudio(index, event) {
      if (event && event.target.classList.contains('btn-focus')) return;
      const card = document.getElementById(`card-${index}`);
      const isCurrentlyMuted = card.classList.contains('audio-off');
      
      updateCardUI(index, !isCurrentlyMuted);
      updateGlobalButtonState();
    }

    function updateGlobalButtonState() {
      const btnGlobal = document.getElementById('btnGlobal');
      const hasAnyAudioActive = players.some((_, idx) => {
        const card = document.getElementById(`card-${idx}`);
        return card && !card.classList.contains('audio-off');
      });

      if (hasAnyAudioActive) {
        btnGlobal.innerText = '🔇 Muta Tutti';
        btnGlobal.className = 'btn-control btn-global mute-mode';
      } else {
        btnGlobal.innerText = '🔊 Attiva Tutti gli Audio';
        btnGlobal.className = 'btn-control btn-global unmute-mode';
      }
    }

    function handleGlobalClick() {
      const hasAnyAudioActive = players.some((_, idx) => {
        const card = document.getElementById(`card-${idx}`);
        return card && !card.classList.contains('audio-off');
      });

      const targetMuteState = hasAnyAudioActive;
      for (let i = 0; i < 5; i++) {
        updateCardUI(i, targetMuteState);
      }
      updateGlobalButtonState();
    }
  </script>
</body>
</html>
