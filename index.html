<script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const youtubeIDs = [
      'ctNbkpWVy4g',
      '', 
      'FNPA_kQMaD0',
      '6SaxWshz-Hg',
      '8eQmVKUpvYU'
    ];

    let players = [];
    let isPlaying = false;
    let maxDuration = 0;
    let featuredIndex = null;
    let previousAudioStates = [];
    const grid = document.querySelector('.grid');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const btnPlayPause = document.getElementById('btnPlayPause');

    function onYouTubeIframeAPIReady() {
      for (let i = 0; i < 5; i++) {
        if (!youtubeIDs[i]) continue;

        players[i] = new YT.Player(`v${i}`, {
          videoId: youtubeIDs[i],
          playerVars: {
            'controls': 0,
            'rel': 0,
            'modestbranding': 1,
            'playsinline': 1,
            'enablejsapi': 1
          },
          events: { 
            'onReady': (event) => onPlayerReady(event, i),
            'onStateChange': (event) => onPlayerStateChange(event, i)
          }
        });
      }
    }

    function onPlayerReady(event, index) {
      const p = event.target;
      p.mute();
      
      if (typeof p.getDuration === 'function') {
        const d = p.getDuration();
        if (d > maxDuration) maxDuration = d;
      }
    }

    // Gestisce la fine dei singoli video per evitare il riavvio in loop
    function onPlayerStateChange(event, index) {
      if (event.data === YT.PlayerState.ENDED) {
        const p = players[index];
        if (p && p.pauseVideo) {
          p.pauseVideo();
        }
      }
    }

    setInterval(() => {
      const activePlayer = players.find(p => p && typeof p.getCurrentTime === 'function');
      if (maxDuration > 0 && activePlayer) {
        const currentTime = activePlayer.getCurrentTime() || 0;
        const progress = (currentTime / maxDuration) * 100;
        seekBar.value = progress;
        timeDisplay.innerText = `${formatTime(currentTime)} / ${formatTime(maxDuration)}`;
      }
    }, 100);

    function hideAllPosters() {
      document.querySelectorAll('.poster-img').forEach(img => img.classList.add('hidden'));
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;

      if (isPlaying) {
        hideAllPosters();
      }

      const activePlayer = players.find(p => p && typeof p.getCurrentTime === 'function');
      const refTime = activePlayer ? activePlayer.getCurrentTime() : 0;

      players.forEach((p, idx) => {
        if (p && p.playVideo) {
          const videoDuration = typeof p.getDuration === 'function' ? p.getDuration() : maxDuration;
          
          if (isPlaying) {
            // Fai partire il video solo se il tempo corrente non supera la sua durata
            if (refTime < videoDuration) {
              p.seekTo(refTime, true);
              const card = document.getElementById(`card-${idx}`);
              if (card && !card.classList.contains('audio-off')) {
                p.unMute();
              } else {
                p.mute();
              }
              p.playVideo();
            } else {
              p.pauseVideo();
            }
          } else {
            p.pauseVideo();
          }
        }
      });
      btnPlayPause.innerText = isPlaying ? '⏸️ Pausa' : '▶️ Play';
    }

    // Gestione dello scrubber sincronizzato con la durata singola di ogni traccia
    function seekAll(percent) {
      if (!maxDuration) return;
      const targetTime = (percent / 100) * maxDuration;

      players.forEach(p => {
        if (p && p.seekTo) {
          const videoDuration = typeof p.getDuration === 'function' ? p.getDuration() : maxDuration;
          
          if (targetTime < videoDuration) {
            p.seekTo(targetTime, true);
            if (isPlaying) p.playVideo();
          } else {
            // Se il target supera la durata del video, lo porta alla fine e lo mette in pausa
            p.seekTo(videoDuration - 0.1, true);
            p.pauseVideo();
          }
        }
      });
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function toggleFocus(index, event) {
      if (event) event.stopPropagation();
      const card = document.getElementById(`card-${index}`);
      const btnFocus = card.querySelector('.btn-focus');

      if (featuredIndex === index) {
        card.classList.remove('featured');
        grid.classList.remove('has-featured');
        btnFocus.innerText = '🔍 Ingrandisci';
        featuredIndex = null;
        players.forEach((_, i) => updateCardUI(i, previousAudioStates[i]));
      } else {
        previousAudioStates = players.map(p => {
          const c = document.getElementById(`card-${p}`);
          return c ? c.classList.contains('audio-off') : false;
        });

        players.forEach((_, i) => {
          const c = document.getElementById(`card-${i}`);
          if (c) {
            c.classList.remove('featured');
            c.querySelector('.btn-focus').innerText = '🔍 Ingrandisci';
          }
        });

        card.classList.add('featured');
        grid.classList.add('has-featured');
        btnFocus.innerText = '🔙 Riduci';
        featuredIndex = index;
        players.forEach((_, i) => updateCardUI(i, i !== index));
      }
      updateGlobalButtonState();
    }

    function updateCardUI(index, isMuted) {
      const player = players[index];
      const card = document.getElementById(`card-${index}`);
      if (!card) return;
      const button = card.querySelector('.btn-single');

      if (isMuted) {
        if (player && player.mute) player.mute();
        card.classList.add('audio-off');
        if (button) button.innerText = '🔊 Audio Off';
      } else {
        if (player && player.unMute) player.unMute();
        card.classList.remove('audio-off');
        if (button) button.innerText = '🔊 Audio ON';
      }
    }

    function toggleAudio(index, event) {
      if (event && event.target.classList.contains('btn-focus')) return;
      const card = document.getElementById(`card-${index}`);
      const isCurrentlyMuted = card.classList.contains('audio-off');
      
      updateCardUI(index, !isCurrentlyMuted);
      updateGlobalButtonState();
    }

    function updateGlobalButtonState() {
      const btnGlobal = document.getElementById('btnGlobal');
      const hasAnyAudioActive = players.some((_, idx) => {
        const card = document.getElementById(`card-${idx}`);
        return card && !card.classList.contains('audio-off');
      });

      if (hasAnyAudioActive) {
        btnGlobal.innerText = '🔇 Muta Tutti';
        btnGlobal.className = 'btn-control btn-global mute-mode';
      } else {
        btnGlobal.innerText = '🔊 Attiva Tutti gli Audio';
        btnGlobal.className = 'btn-control btn-global unmute-mode';
      }
    }

    function handleGlobalClick() {
      const hasAnyAudioActive = players.some((_, idx) => {
        const card = document.getElementById(`card-${idx}`);
        return card && !card.classList.contains('audio-off');
      });

      const targetMuteState = hasAnyAudioActive;
      for (let i = 0; i < 5; i++) {
        updateCardUI(i, targetMuteState);
      }
      updateGlobalButtonState();
    }
  </script>
